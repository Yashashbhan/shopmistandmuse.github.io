<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mist & Muse | Atmospheric Fragrances & Attars</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Georgia', serif;
            background-color: #FAF8F5;
            color: #2C2C2C;
            text-align: center;
            padding: 40px 20px;
        }
        header {
            margin-bottom: 40px;
        }
        h1 {
            font-size: 42px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #1A1A1A;
            margin-bottom: 10px;
        }
        p.tagline {
            font-size: 18px;
            font-style: italic;
            color: #666;
            letter-spacing: 1px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #FFFFFF;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .status-badge {
            display: inline-block;
            background-color: #2C2C2C;
            color: #FFFFFF;
            padding: 10px 20px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }
        .desc {
            font-size: 16px;
            line-height: 1.6;
            color: #444;
            margin-bottom: 30px;
        }
        .btn-insta {
            display: inline-block;
            text-decoration: none;
            background: #E1306C;
            color: white;
            padding: 14px 28px;
            font-family: sans-serif;
            font-weight: bold;
            border-radius: 50px;
            transition: background 0.3s ease;
        }
        .btn-insta:hover {
            background: #C13584;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mist & Muse</h1>
        <p class="tagline">The Art of Atmosphere & Inspiration</p>
    </header>

    <div class="container">
        <div class="status-badge">Official Catalog Coming Soon</div>
        <p class="desc">
            We are curating our signature collections of light body mists and concentrated luxury attars. 
            Full catalog, fragrance note breakdowns, and direct ordering options will be available here shortly.
        </p>
        <a href="https://instagram.com" class="btn-insta" target="_blank">Follow Us on Instagram</a>
    </div>

</body>
</html>
